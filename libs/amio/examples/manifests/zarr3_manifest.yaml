# AMIO Manifest: Zarr v3 Backend (NCZarr fallback)
#
# Write a 2D sea surface temperature field to a Zarr v3 store.
# Uses the NCZarr fallback when TensorStore is not available.

backend: zarr3
path: output_zarr.zarr
mode: nczarr

staging_pool:
  buffer_count: 4
  buffer_capacity_bytes: 20971520 # 20 MiB per buffer

worker_pool:
  threads: 2

prefetch:
  depth: 4
  read_timeout_s: 60

staging_timeout_ms: 10000

codec:
  active_codec: blosc
  lossless_allow_list:
    - blosc
    - zstandard
