[build-system]
requires = ["scikit-build-core>=0.5", "nanobind>=2.0.0", "numpy"]
build-backend = "scikit_build_core.build"

[project]
name = "axis-regrid"
version = "0.1.0"
description = "Arbitrary eXgrid Interpolation Solver (AXIS) Python bindings"
readme = "README.md"
requires-python = ">=3.12"
license = {text = "Apache-2.0"}
dependencies = [
    "cf-xarray",
    "dask[array]",
    "netCDF4",
    "numpy",
    "xarray",
]

[dependency-groups]
test = [
    "pyproj",
    "pytest",
    "scipy",
]
# Cross-validation extras (NOT in the default test group — CI runs bare
# `uv run pytest` on platforms where esmpy/xesmf cannot resolve).
# The interop tests importorskip them; install manually for full parity:
#   uv pip install esmpy xesmf   (or use the helm-dev-benchmarks image)
mypy = [
    "mypy",
    #
    "pandas-stubs",
    "scipy-stubs",
    "types-pexpect",
    "types-psutil",
    "types-Pygments",
    "types-PyYAML",
]

[project.scripts]
axis-regrid = "axis.cli:main"

[tool.pytest.ini_options]
# Keep collection scoped to the real suite so benchmark probes under
# benchmarks/ (e.g. c96_vs_esmf_probe.py) are not imported by bare `pytest`
# in CI. Scratch scripts must never be named test_*.py at the package root.
testpaths = ["tests_python"]

[tool.scikit-build]
cmake.args = [
    "-DAXIS_BUILD_PYTHON=ON",
    "-DAXIS_BUILD_TESTING=OFF",
    "-DAXIS_BUILD_FORTRAN=OFF",
    "-DAXIS_BUILD_BENCHMARKS=OFF",
    "-DAXIS_BUILD_EXAMPLES=OFF",
]
cmake.source-dir = "."

[tool.mypy]
# `packages = ["axis"]` type-checks the *installed* package, so its bundled
# _core.pyi stub resolves _core. The downside is a rebuild/reinstall is
# needed before mypy sees Python source edits.
#
# For faster dev cycles when working on typing, symlink the stub into the source
# tree once, then run mypy against the source path directly (no reinstall, and no
# MYPYPATH needed — mypy auto-detects `python/` as the package root):
#
#   ln -sf "$(uv run python -c 'import importlib.util, os; print(os.path.join(os.path.dirname(importlib.util.find_spec("axis").origin), "_core.pyi"))')" python/axis/
#   uv run mypy python/axis
#
packages = ["axis"]
exclude = "^build.*/"

[[tool.mypy.overrides]]
module = ["cdo", "xregrid"]
ignore_missing_imports = true
