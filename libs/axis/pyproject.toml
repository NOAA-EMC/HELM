[build-system]
requires = ["scikit-build-core>=0.5", "nanobind>=2.0.0", "numpy"]
build-backend = "scikit_build_core.build"

[project]
name = "axis-regrid"
version = "0.1.0"
description = "Arbitrary eXgrid Interpolation Solver (AXIS) Python bindings"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
dependencies = [
    "cf-xarray",
    "numpy",
    "xarray",
]

[project.optional-dependencies]
netcdf = [
    "netCDF4",
]
dask = [
    "dask",
]

[dependency-groups]
test = [
    "dask",
    "netCDF4",
    "pyproj",
    "pytest",
    "scipy",
]
mypy = [
    "mypy",
    #
    "pandas-stubs",
    "scipy-stubs",
    "types-pexpect",
    "types-psutil",
    "types-Pygments",
    "types-PyYAML",
]

[project.scripts]
axis-regrid = "axis.cli:main"

[tool.pytest.ini_options]
# Keep collection scoped to the real suite so scratch scripts at the
# package root (e.g. test_c96_comparison.py) or benchmark probes under
# benchmarks/ are not imported by bare `pytest` in CI.
testpaths = ["tests_python"]

[tool.scikit-build]
cmake.args = [
    "-DAXIS_BUILD_PYTHON=ON",
    "-DAXIS_BUILD_TESTING=OFF",
    "-DAXIS_BUILD_FORTRAN=OFF",
    "-DAXIS_BUILD_BENCHMARKS=OFF",
    "-DAXIS_BUILD_EXAMPLES=OFF",
]
cmake.source-dir = "."

[tool.mypy]
# `packages = ["axis"]` type-checks the *installed* package, so its bundled
# axis_py.pyi stub resolves axis_py. The downside is a rebuild/reinstall is
# needed before mypy sees Python source edits.
#
# For faster dev cycles when working on typing, symlink the stub into the source
# tree once, then run mypy against the source path directly (no reinstall, and no
# MYPYPATH needed — mypy auto-detects `python/` as the package root):
#
#   ln -sf "$(uv run python -c 'import importlib.util, os; print(os.path.join(os.path.dirname(importlib.util.find_spec("axis").origin), "axis_py.pyi"))')" python/axis/
#   uv run mypy python/axis
#
packages = ["axis"]
exclude = "^build.*/"

[[tool.mypy.overrides]]
module = ["cdo", "xregrid"]
ignore_missing_imports = true
