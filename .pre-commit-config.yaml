repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
        args: ["--unsafe"]
      - id: check-json
      - id: check-toml
      - id: check-shebang-scripts-are-executable
      - id: check-executables-have-shebangs
      - id: check-symlinks
      - id: check-added-large-files
        args: ["--maxkb=1000"]
      - id: check-merge-conflict
      - id: mixed-line-ending
        args: ["--fix=lf"]

  - repo: https://github.com/pre-commit/mirrors-clang-format
    rev: v22.1.8
    hooks:
      - id: clang-format
        types_or: [c, c++]
        args: ["--style=file"]

  # CMake + Fortran formatting — absorbed from AMIO's standalone pre-commit
  # config when it joined the repo. Scoped to libs/amio/ so the first
  # absorption run stays format-neutral for the other libraries; broaden in a
  # follow-up once siblings are baselined. libs/amio/.cmake-format.yaml is
  # discovered by cmake-format's config walk-up from each listfile.
  - repo: https://github.com/cheshirekow/cmake-format-precommit
    rev: v0.6.13
    hooks:
      - id: cmake-format
        additional_dependencies: [pyyaml>=5.1]
        files: ^libs/amio/

  - repo: https://github.com/pseewald/fprettify
    rev: v0.3.7
    hooks:
      - id: fprettify
        args: ["--indent", "4", "--line-length", "150", "--whitespace", "3"]
        types: [fortran]
        files: ^libs/amio/

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.21
    hooks:
      - id: ruff-check
        args: ["--fix"]
      - id: ruff-format

  # Shell script linting — Put more effort into errors than style
  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: v0.11.0.1-1
    hooks:
      - id: shellcheck
        args: ["--severity=warning"]

  # YAML formatting
  - repo: https://github.com/rbubley/mirrors-prettier
    rev: "v3.9.8"
    hooks:
      - id: prettier
        types_or: [yaml]
