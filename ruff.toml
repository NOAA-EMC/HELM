target-version = "py310"
line-length = 132

[lint]
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflakes
    "I",  # isort
    "B",  # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
]
ignore = [
    "E501",  # line too long
    "B028",  # explicit `stacklevel` in `warnings.warn`
]

[lint.per-file-ignores]
# Spack package recipes are required to use `from spack.package import *`; the
# entire Spack DSL (variant, depends_on, version, conflicts, run_after, ctest,
# ...) is injected by that star import. F403/F405 are therefore false positives
# for any Spack recipe. Recipes live in varying layouts (`spack/package.py`,
# `packages/<name>/package.py`), so match the Spack-exclusive `package.py` name.
"**/package.py" = ["F403", "F405"]
