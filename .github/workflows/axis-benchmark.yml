# ─────────────────────────────────────────────────────────────────────────────
# AXIS Benchmark CI Pipeline (GitHub Actions)
#
# Performance regression detection for the AXIS interpolation library.
# Runs on every merge to main and compares against stored baselines.
#
# Benchmark cases (Requirement 13.1, 6.1):
#   1. Bilinear O48→O96
#   2. Conservative O48→O96
#   3. Batch apply 10 vars O96→O96
#   4. CSR apply O96→O96
#   5. Conservative 1440×720→720×360
#   6. Conservative 3600×1800→1440×720
#
# Regression threshold: 15% above baseline (Requirement 6.3)
# Execution: Kokkos::HostSpace for reproducibility (Requirement 13.5)
# Output: JSON with case name, wall_clock_ms, date, commit (Requirement 13.3)
# Manual dispatch: update baseline (Requirement 13.4)
# ─────────────────────────────────────────────────────────────────────────────
name: AXIS Benchmark

on:
  push:
    branches: [develop]
    paths:
      - "libs/axis/**"
      - ".github/workflows/axis-benchmark.yml"
  workflow_dispatch:
    inputs:
      update_baseline:
        description: "Update baseline with current run results"
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"

jobs:
  benchmark:
    name: AXIS performance benchmarks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Bring up HELM container
        run: docker compose up -d --build

      # Build AXIS in Release mode for accurate timing (Requirement 13.5).
      - name: "Build AXIS (Release, HostSpace)"
        run: |
          docker compose exec -T helm-dev bash -lc '
            set -e
            cd libs/axis
            rm -rf build-bench
            cmake -B build-bench -G Ninja \
              -DCMAKE_CXX_STANDARD=20 \
              -DCMAKE_BUILD_TYPE=Release \
              -DAXIS_BUILD_TESTING=OFF \
              -DAXIS_BUILD_BENCHMARKS=ON
            cmake --build build-bench --parallel $(nproc)
          '

      # Run the benchmark harness and capture JSON output (Requirement 13.1).
      - name: "Run benchmarks"
        run: |
          docker compose exec -T helm-dev bash -lc '
            set -e
            OMP_PROC_BIND=false libs/axis/build-bench/benchmarks/axis_benchmarks \
              --commit ${{ github.sha }} \
              --output benchmark_results.json
          '

      # Compare against baseline; fail if regression >15% (Requirements 6.2, 6.3, 13.6).
      - name: "Check for regressions"
        if: ${{ github.event.inputs.update_baseline != 'true' }}
        run: |
          docker compose exec -T helm-dev bash -lc '
            set -e
            python3 libs/axis/benchmarks/check_regression.py \
              libs/axis/benchmarks/baseline.json \
              benchmark_results.json \
              0.15
          '

      # Update baseline when manually triggered (Requirement 13.4).
      - name: "Update baseline"
        if: ${{ github.event.inputs.update_baseline == 'true' }}
        run: |
          cp benchmark_results.json libs/axis/benchmarks/baseline.json
          # Note: In practice this would commit and push, but that requires
          # write permissions configured on the workflow token.
          echo "Baseline updated with current results."

      # Upload results as artifact for historical tracking.
      - name: "Upload benchmark results"
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: axis-benchmark-results
          path: benchmark_results.json
          retention-days: 90

      - name: Tear down container
        if: always()
        run: docker compose down || true
