# ─────────────────────────────────────────────────────────────────────────────
# AXIS CI Pipeline (GitHub Actions)
#
# Run independent validation tracks concurrently so failures surface sooner.
# Each job uses the HELM project container built from ./Dockerfile.
# ─────────────────────────────────────────────────────────────────────────────
name: AXIS CI

on:
  push:
    branches: [develop]
    paths:
      - "libs/axis/**"
      - "Dockerfile"
      - "docker-compose.yml"
      - ".github/workflows/axis-ci.yml"
  pull_request:
    paths:
      - "libs/axis/**"
      - "Dockerfile"
      - "docker-compose.yml"
      - ".github/workflows/axis-ci.yml"
  workflow_dispatch:

jobs:
  python-no-mpi:
    name: Python source installs without MPI
    runs-on: ubuntu-latest
    container: ubuntu:24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - name: Install build tools and uv
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends ca-certificates cmake ninja-build g++ git python3-dev python3-venv
          python3 -m venv /tmp/axis-tools
          /tmp/axis-tools/bin/pip install uv
      - name: Build and test with pip and uv
        env:
          CMAKE_BUILD_PARALLEL_LEVEL: 2
          CMAKE_ARGS: -DAXIS_KOKKOS_OPENMP=OFF
        run: |
          export PATH="/tmp/axis-tools/bin:$PATH"
          bash .github/scripts/axis-no-mpi-test.sh

  native:
    name: AXIS native build and tests
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Bring up HELM container
        run: docker compose up -d --build

      - name: "Stage 1: Tier isolation scan"
        run: |
          docker compose exec -T helm-dev bash -lc '
            cd libs/axis && bash cmake/check_tier1_isolation.sh .
          '

      - name: "Stage 2: Standalone build (produces HELM::AXIS)"
        run: |
          docker compose exec -T helm-dev bash -lc '
            set -e
            cd libs/axis
            cmake -B build-ci -G Ninja \
              -DCMAKE_CXX_STANDARD=20 \
              -DAXIS_BUILD_TESTING=ON
            cmake --build build-ci --parallel $(nproc)
          '

      - name: "Stage 2b: Downstream HELM::AXIS consumer"
        run: |
          docker compose exec -T helm-dev bash -lc '
            set -e
            rm -rf /tmp/axis_consumer && mkdir -p /tmp/axis_consumer
            cat > /tmp/axis_consumer/CMakeLists.txt <<EOF
          cmake_minimum_required(VERSION 3.21)
          project(axis_consumer LANGUAGES CXX)
          set(CMAKE_CXX_STANDARD 20)
          add_subdirectory(/workspace/helm-project/libs/axis \${CMAKE_BINARY_DIR}/axis_build)
          add_executable(consumer main.cpp)
          target_link_libraries(consumer PRIVATE HELM::AXIS)
          EOF
            printf "#include <axis/axis.hpp>\nint main() { return 0; }\n" > /tmp/axis_consumer/main.cpp
            cd /tmp/axis_consumer
            cmake -B build -G Ninja -DAXIS_BUILD_TESTING=OFF
            cmake --build build --target consumer
          '

      - name: "Stage 3: Unit tests"
        run: |
          docker compose exec -T helm-dev bash -lc '
            cd libs/axis/build-ci && ctest -L unit --output-on-failure
          '

      - name: "Stage 4: Property tests"
        run: |
          docker compose exec -T helm-dev bash -lc '
            cd libs/axis/build-ci && ctest -L property --output-on-failure
          '

      - name: "Stage 5: Distributed MPI tests"
        run: |
          docker compose exec -T helm-dev bash -lc '
            set -e
            cd libs/axis/build-ci
            # Hybrid workers outnumber runner cores. Let idle threads sleep
            # and share CPUs instead of spinning inside MPI process bindings.
            OMPI_MCA_rmaps_base_oversubscribe=1 \
              OMPI_MCA_mpi_yield_when_idle=1 \
              OMPI_MCA_hwloc_base_binding_policy=none \
              OMP_WAIT_POLICY=PASSIVE \
              ctest -L mpi --output-on-failure
          '

      - name: Tear down container
        if: always()
        run: docker compose down || true

  sanitizer:
    name: AXIS ASan and UBSan tests
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Bring up HELM container
        run: docker compose up -d --build

      - name: "Sanitizer build and property tests"
        run: |
          docker compose exec -T helm-dev bash -lc '
            set -e
            cd libs/axis
            cmake -B build-asan -G Ninja \
              -DCMAKE_CXX_STANDARD=20 \
              -DAXIS_BUILD_TESTING=ON \
              -DCMAKE_CXX_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer -g"
            cmake --build build-asan --parallel $(nproc)
            cd build-asan
            ASAN_OPTIONS=detect_leaks=0 UBSAN_OPTIONS=print_stacktrace=1:halt_on_error=1 \
              ctest -L property --output-on-failure
          '

      - name: Tear down container
        if: always()
        run: docker compose down || true

  python:
    name: AXIS Python tests and types
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Bring up HELM container
        run: docker compose up -d --build

      - name: "Python tests and mypy"
        run: |
          docker compose exec -T helm-dev bash -lc '
            set -e
            cd libs/axis
            # Python source builds must not discover or invoke a Fortran compiler.
            export FC=/nonexistent/fortran-disabled-for-python
            # Exercise optional native weight-file I/O against the image
            # serial NetCDF in addition to the MPI-free default job above.
            uv sync --no-managed-python --all-groups --config-setting cmake.define.AXIS_ENABLE_NETCDF=ON
            uv run --no-sync pytest -v -ra
            uv run --no-sync mypy
          '

      - name: Tear down container
        if: always()
        run: docker compose down || true
