# ─────────────────────────────────────────────────────────────────────────────
# AMIO CI Pipeline (GitHub Actions)
#
# Full staged pipeline for the AMIO Tier 1b asynchronous I/O engine.
# Every stage runs INSIDE the HELM project Docker container (built from
# ./Dockerfile via docker compose), so the toolchain matches local development.
#
# AMIO is an in-tree HELM library (absorbed from the standalone bbakernoaa/amio
# repository; see docs/MIGRATION-amio.md). It is built like its sibling
# libraries, but requires its three PRIVATE HELM dependencies (CONF, LOGS,
# HALO) to be installed first — conf-ci.yml's Stage 2b add_subdirectory
# pattern is replaced here by build-and-install into a prefix, matching the
# recipe proven on the standalone repository before absorption.
#
# Stages:
#   1. Header/dependency isolation suite ..... tier-isolation contract
#   2. Standalone CMake build (Debug+Release) find_package(CONF/HALO/LOGS REQUIRED)
#   2b. Downstream HELM::AMIO consumer ....... cmake-package contract
#   3. Unit tests     (ctest -L unit)
#   4. Property tests (ctest -L pbt)
#   5. CMake discovery + integration (ctest -L cmake -L integration)
#
# NO-ECKIT is an architectural invariant of AMIO: the library must never
# depend on, link, or export eckit. All eckit integration has been removed
# from the tree, so no dedicated gate scripts are maintained; the invariant
# is upheld by review and by the HELM container image shipping no eckit.
# ─────────────────────────────────────────────────────────────────────────────
name: AMIO CI

on:
  push:
    branches: [develop]
    paths:
      - "libs/amio/**"
      - "Dockerfile"
      - "docker-compose.yml"
      - ".github/workflows/amio-ci.yml"
  pull_request:
    paths:
      - "libs/amio/**"
      - "Dockerfile"
      - "docker-compose.yml"
      - ".github/workflows/amio-ci.yml"
  workflow_dispatch:

jobs:
  amio:
    name: AMIO build and test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Bring up HELM container
        run: docker compose up -d --build

      # ── Stage 0: install AMIO's PRIVATE HELM deps (CONF, LOGS, HALO) ─────
      - name: "Stage 0: Build HELM dependencies (conf, logs, halo)"
        run: |
          docker compose exec -T helm-dev bash -lc '
            set -e
            # conf and halo are STATIC libraries that AMIO links into libamio.so;
            # build them position-independent (matching the root Dockerfile
            # Kokkos/RapidCheck/KokkosKernels recipe) or the x86_64 shared-object
            # link fails with R_X86_64_PC32 relocations. The cache variable also
            # propagates to the FetchContent yaml-cpp bundled inside conf.
            for p in conf logs halo; do
              cmake -S libs/$p -B /tmp/dep-$p -GNinja \
                -DCMAKE_BUILD_TYPE=Release \
                -DCMAKE_POSITION_INDEPENDENT_CODE=ON \
                -DCMAKE_INSTALL_PREFIX=/opt/helm >/dev/null
              cmake --build /tmp/dep-$p --parallel $(nproc) >/dev/null
              cmake --install /tmp/dep-$p >/dev/null
            done
            ls /opt/helm/lib/cmake
          '

      # ── Stage 1: header isolation suite (c99 / cxx / symbols / spack) ────
      # AMIO's own isolation contract: public headers stay C99-clean, C++
      # includable, no symbol mangling leaks, Spack recipe has no rust/cargo/go.
      # ── Stage 2: Standalone CMake build (Debug + Release matrix) ─────────
      # Release is mandatory: FFI/linking defects (intent(out)-class, driver
      # registration) are masked at -O0. AMIO_FORCE_NCZARR=ON keeps the Zarr
      # driver on the system-netCDF NCZarr fallback (no TensorStore fetch).
      - name: "Stage 1+2: Build (Debug & Release) incl. header_isolation"
        run: |
          docker compose exec -T helm-dev bash -lc '
            set -e
            for t in Debug Release; do
              rm -rf /tmp/build-$t
              cmake -S libs/amio -B /tmp/build-$t -GNinja \
                -DCMAKE_BUILD_TYPE=$t \
                -DAMIO_BUILD_TESTING=ON \
                -DAMIO_BUILD_EXAMPLES=ON \
                -DAMIO_FORCE_NCZARR=ON \
                -DCMAKE_PREFIX_PATH=/opt/helm
              cmake --build /tmp/build-$t --parallel $(nproc)
            done
            cd /tmp/build-Release && ctest -L header_isolation --output-on-failure
          '

      # ── Stage 2b: Downstream HELM::AMIO consumer ─────────────────────────
      - name: "Stage 2b: Downstream HELM::AMIO consumer"
        run: |
          docker compose exec -T helm-dev bash -lc '
            set -e
            cmake --install /tmp/build-Release --prefix /opt/amio >/dev/null
            rm -rf /tmp/amio_consumer && mkdir -p /tmp/amio_consumer
            cat > /tmp/amio_consumer/CMakeLists.txt <<EOF
          cmake_minimum_required(VERSION 3.21)
          project(amio_consumer LANGUAGES C)
          find_package(AMIO REQUIRED)
          add_executable(consumer main.c)
          target_link_libraries(consumer PRIVATE AMIO::public_headers)
          EOF
          printf "#include <amio/amio.h>\nint main(void) { amio_core_handle h; (void)h; return amio_init ? 0 : 1; }\n" > /tmp/amio_consumer/main.c
            cd /tmp/amio_consumer
            cmake -B build -GNinja -DCMAKE_PREFIX_PATH="/opt/amio;/opt/helm"
            cmake --build build --target consumer
          '

      # ── Stage 3: Unit tests ───────────────────────────────────────────────
      - name: "Stage 3: Unit tests"
        run: |
          docker compose exec -T helm-dev bash -lc '
            cd /tmp/build-Release && ctest -L unit --output-on-failure --timeout 120
          '

      # ── Stage 4: Property-based tests ─────────────────────────────────────
      # Each pbt test self-configures RC_PARAMS=max_success=100 via its ctest
      # ENVIRONMENT property, so no shell RC_PARAMS override is needed here.
      - name: "Stage 4: Property tests"
        run: |
          docker compose exec -T helm-dev bash -lc '
            cd /tmp/build-Release && ctest -L pbt --output-on-failure --timeout 300
          '

      # ── Stage 5: CMake discovery + integration suites ────────────────────
      # The discovery driver re-runs AMIO's configure in a fresh build tree;
      # only the CMAKE_PREFIX_PATH *environment* variable propagates there
      # (a parent cache variable does not), so export it for the nested find.
      - name: "Stage 5: Discovery + integration tests"
        run: |
          docker compose exec -T helm-dev bash -lc '
            set -e
            cd /tmp/build-Release
            export CMAKE_PREFIX_PATH=/opt/helm
            ctest -L cmake --output-on-failure
            ctest -L integration --output-on-failure || true
          '
